name: Release

on:
    release:
        types: [created]

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test -- --run

            - name: Build package
              run: npm run build

            - name: Publish to npm
              run: npm publish --access public
